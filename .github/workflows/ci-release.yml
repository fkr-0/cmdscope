name: CI and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  create-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$TAG_NAME" in
            v*) ;;
            *) echo "release tag must start with v: $TAG_NAME" >&2; exit 1 ;;
          esac
          VERSION="${TAG_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-file release-notes.md

  release-assets:
    name: build ${{ matrix.asset_name }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cmdscope-x86_64-unknown-linux-gnu.tar.gz
            archive: tar
            binary: cmdscope
          - os: macos-latest
            asset_name: cmdscope-macos.tar.gz
            archive: tar
            binary: cmdscope
          - os: windows-latest
            asset_name: cmdscope-x86_64-pc-windows-msvc.zip
            archive: zip
            binary: cmdscope.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        if: matrix.archive == 'tar'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          cp "target/release/$BINARY" dist/
          cp README.md CHANGELOG.md examples.config.toml dist/
          tar -czf "$ASSET_NAME" -C dist .

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BINARY: ${{ matrix.binary }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/$env:BINARY" dist/
          Copy-Item README.md, CHANGELOG.md, examples.config.toml dist/
          Compress-Archive -Path dist/* -DestinationPath $env:ASSET_NAME -Force

      - name: Upload asset to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: gh release upload "$TAG_NAME" "$ASSET_NAME" --clobber
