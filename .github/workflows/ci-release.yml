name: CI and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt clippy

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  create-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --verify-tag --generate-notes --title "$TAG_NAME"

  release-assets:
    name: build ${{ matrix.asset_name }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cmdscope-x86_64-unknown-linux-gnu.tar.gz
            archive: tar
            binary: cmdscope
          - os: macos-latest
            asset_name: cmdscope-macos.tar.gz
            archive: tar
            binary: cmdscope
          - os: windows-latest
            asset_name: cmdscope-x86_64-pc-windows-msvc.zip
            archive: zip
            binary: cmdscope.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        if: matrix.archive == 'tar'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          cp "target/release/$BINARY" dist/
          cp README.md examples.config.toml dist/
          tar -czf "$ASSET_NAME" -C dist .

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BINARY: ${{ matrix.binary }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/$env:BINARY" dist/
          Copy-Item README.md, examples.config.toml dist/
          Compress-Archive -Path dist/* -DestinationPath $env:ASSET_NAME -Force

      - name: Upload asset to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: gh release upload "$TAG_NAME" "$ASSET_NAME" --clobber
