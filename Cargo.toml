[package]
name = "cmdscope"
version = "0.1.0"
edition = "2024"
description = "Interactive Rust TUI for filtering Atuin shell history"
license = "MIT"

[lib]
name = "cmdscope"
path = "src/lib.rs"

[[bin]]
name = "cmdscope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30.0"
rusqlite = { version = "0.37", features = ["bundled"] }
skim = "4.6.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
