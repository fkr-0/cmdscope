[package]
name = "cmdscope"
version = "0.4.0"
edition = "2024"
description = "Interactive Rust TUI for filtering Atuin shell history"
license = "MIT"
repository = "https://github.com/fkr-0/cmdscope"
readme = "README.md"
exclude = ["release-evidence.yml", "tasks.yml"]

[lib]
name = "cmdscope"
path = "src/lib.rs"

[[bin]]
name = "cmdscope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30.0"
rusqlite = { version = "0.37", features = ["bundled"] }
skim = "4.6.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
# Keep debug and test builds from accumulating large incremental compiler caches.
[profile.dev]
incremental = false

[profile.test]
incremental = false
