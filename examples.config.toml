global = "ctrl-g"
pwd = "ctrl-p"
git_root = "ctrl-r"
toggle_scope = "tab"
context = "ctrl-o"
context_expand = "alt-]"
context_shrink = "alt-["
toggle_pwd_mode = "ctrl-s"
toggle_metadata = "alt-m"
actions = "ctrl-space"
toggle_date = "alt-1"
toggle_pwd = "alt-2"
toggle_exit = "alt-3"
toggle_duration = "alt-4"
select_next = ["down", "ctrl-n"]
select_previous = ["up", "ctrl-k"]
accept = "enter"
quit = ["esc", "ctrl-c"]
backspace = "backspace"
delete = ["delete", "ctrl-d"]
delete_word = "ctrl-w"
clear_query = "ctrl-u"
cursor_left = ["left", "ctrl-b"]
cursor_right = ["right", "ctrl-f"]
cursor_start = ["home", "ctrl-a"]
cursor_end = ["end", "ctrl-e"]

[pwd]
mode = "subdirs"

[ui]
# Legacy metadata list remains accepted for compatibility.
history_columns = ["date", "pwd"]
# Persistent preview is shown on sufficiently large terminals.
preview = true

[ui.columns]
date = true
pwd = true
exit = false
duration = false
date_format = "relative" # relative, relative_long, date, datetime, datetime_seconds, iso8601, epoch
min_width = 12
