[keys]
global = "ctrl-g"
pwd = "ctrl-p"
git_root = "ctrl-r"
toggle_scope = "tab"
context = "ctrl-o"
context_expand = "alt-]"
context_shrink = "alt-["
toggle_pwd_mode = "ctrl-s"
toggle_metadata = "alt-m"
actions = "ctrl-space"
toggle_date = "alt-1"
toggle_pwd = "alt-2"
toggle_exit = "alt-3"
toggle_duration = "alt-4"
column_next = "alt-c"
column_move_left = "alt-left"
column_move_right = "alt-right"
column_toggle = "alt-v"
sort_by_column = "alt-s"
sort_direction = "alt-r"
select_next = ["up", "ctrl-k"]
select_previous = ["down", "ctrl-n"]
accept = "enter"
quit = ["esc", "ctrl-c"]
backspace = "backspace"
delete = ["delete", "ctrl-d"]
delete_word = "ctrl-w"
clear_query = "ctrl-u"
cursor_left = ["left", "ctrl-b"]
cursor_right = ["right", "ctrl-f"]
cursor_start = ["home", "ctrl-a"]
cursor_end = ["end", "ctrl-e"]

[pwd]
mode = "subdirs"

[ui]
history_columns = ["date", "pwd"]
preview = true

[ui.columns]
date = true
pwd = true
exit = false
duration = false
order = ["date", "pwd", "duration", "exit"]
sort_by = "relevance"
sort_direction = "descending"
date_format = "relative"
min_width = 12

[ui.column.date]
min_width = 8
max_width = 10
align = "right"
truncation = "end"
priority = 10

[ui.column.pwd]
width = 28
min_width = 10
max_width = 36
align = "left"
truncation = "start"
priority = 20

[ui.column.duration]
width = 8
align = "right"
truncation = "end"
priority = 50

[ui.column.exit]
width = 6
align = "right"
truncation = "end"
priority = 60

[ui.menus.actions]
confirm = "enter"
next = ["down", "j"]
previous = ["up", "k"]
cancel = "esc"
[[ui.menus.actions.items]]
label = "insert + exit"
action = "insert+exit"
[[ui.menus.actions.items]]
label = "append"
action = "append"
[[ui.menus.actions.items]]
label = "append + exit"
action = "append+exit"
[[ui.menus.actions.items]]
label = "&& append"
action = "&&append"
[[ui.menus.actions.items]]
label = "|| append"
action = "||append"
[[ui.menus.actions.items]]
label = "append / wrap →"
action = "menu:wrap"
[[ui.menus.actions.items]]
label = "inspect →"
action = "menu:inspect"

[ui.menus.wrap]
[[ui.menus.wrap.items]]
label = "2>&1"
action = "wrap:stderr"
[[ui.menus.wrap.items]]
label = "2>&1 > /dev/null"
action = "wrap:suppress"
[[ui.menus.wrap.items]]
label = "| tee -a …"
action = "wrap:tee"

[ui.menus.inspect]
[[ui.menus.inspect.items]]
label = "location"
action = "window:location"
[[ui.menus.inspect.items]]
label = "timeline"
action = "window:timeline"

[ui.windows.location]
kind = "location"
title = " Location · previous / selected / next "
[ui.windows.location.keymap]
close = "esc"
[ui.windows.timeline]
kind = "timeline"
title = " Timeline · previous / selected / next "
[ui.windows.timeline.keymap]
close = "esc"
[ui.windows.preview]
kind = "preview"
title = " Preview "
[ui.windows.preview.keymap]
close = "esc"

[ui.wraps.stderr]
template = "{command} 2>&1"
[ui.wraps.suppress]
template = "{command} 2>&1 > /dev/null"
[ui.wraps.tee]
template = "{command} | tee -a {query}"
